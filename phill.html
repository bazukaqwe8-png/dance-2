<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GTA Homa Bay - Realistic Edition</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#020617;overflow:hidden;font-family:system-ui}
#hud{position:absolute;top:0;left:0;right:0;height:64px;background:linear-gradient(to bottom,rgba(0,0,0,.85),transparent);color:white;display:flex;justify-content:space-between;align-items:center;padding:0 20px;z-index:10}
#hud-left{display:flex;gap:18px;align-items:center}
.badge{background:rgba(255,255,255,.15);padding:6px 12px;border-radius:20px;font-size:13px;backdrop-filter:blur(8px)}
canvas{display:block}
#minimap{position:absolute;bottom:18px;right:18px;width:150px;height:150px;background:rgba(0,0,0,.6);border:2px solid #334155;border-radius:12px;z-index:10}
#help{position:absolute;bottom:18px;left:18px;background:rgba(0,0,0,.7);color:#cbd5e1;padding:10px 14px;border-radius:12px;font-size:11px;line-height:1.6;z-index:10}
#help b{color:#f59e0b}
#wasted{position:absolute;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;flex-direction:column;z-index:100;color:white}
#wasted h1{font-size:72px;color:#ef4444;letter-spacing:10px}
</style>
</head>
<body>
<div id="hud">
  <div id="hud-left">
    <div class="badge">⭐ <span id="stars"></span> WANTED</div>
    <div class="badge">💰 KSh <span id="cash">1250</span></div>
    <div class="badge">❤️ <span id="health">100</span>%</div>
    <div class="badge">🚗 <span id="speed">0</span> KM/H</div>
  </div>
  <div class="badge">📍 HOMA BAY - Township • Lake Primary Zone</div>
</div>
<canvas id="c"></canvas>
<div id="minimap"><canvas id="mini" width="150" height="150"></canvas></div>
<div id="help"><b>WASD</b> Drive/Walk &nbsp; <b>E</b> Enter Car &nbsp; <b>SPACE</b> Handbrake/Drift &nbsp; <b>F</b> Honk<br><b>R</b> Repair &nbsp; Steal cars to earn cash, avoid police!</div>
<div id="wasted"><h1>WASTED</h1><p style="margin-top:12px;color:#94a3b8">You were busted in Homa Bay</p><button onclick="location.reload()" style="margin-top:18px;padding:10px 20px;border:none;border-radius:20px;background:#ef4444;color:white;font-weight:700;cursor:pointer">RESPAWN</button></div>

<script>
const canvas=document.getElementById('c'), ctx=canvas.getContext('2d');
const mini=document.getElementById('mini'), mctx=mini.getContext('2d');
function resize(){canvas.width=innerWidth; canvas.height=innerHeight} resize(); window.onresize=resize;

let x=0,y=0, angle=0, speed=0, inCar=false, health=100, cash=1250, wanted=0;
let keys={}, cars=[], cops=[], particles=[];
let playerCar=null;

// Realistic city data
const roads=[];
for(let i=0;i<12;i++){ roads.push({x:i*300-1000,y:-1000,w:40,h:3000}); roads.push({x:-1000,y:i*300-1000,w:3000,h:40}); }

function spawnCar(){
  return {x:(Math.random()-0.5)*2000, y:(Math.random()-0.5)*2000, a:Math.random()*360, v:(Math.random()*0.5+0.5)*(Math.random()>0.5?1:-1), color:`hsl(${20+Math.random()*40},85%,${50+Math.random()*10}%)`, type: Math.random()>0.6?'sedan':'suv'};
}
for(let i=0;i<14;i++) cars.push(spawnCar());

window.onkeydown=e=>keys[e.key.toLowerCase()]=true;
window.onkeyup=e=>keys[e.key.toLowerCase()]=false;

function drawCar(cx,cy,a,color,lights=false){
  ctx.save(); ctx.translate(cx,cy); ctx.rotate(a*Math.PI/180);
  // shadow
  ctx.fillStyle='rgba(0,0,0,.35)'; ctx.beginPath(); ctx.ellipse(3,3,26,14,0,0,Math.PI*2); ctx.fill();
  // body
  ctx.fillStyle=color; ctx.fillRect(-24,-12,48,24);
  ctx.fillStyle='#0f172a'; ctx.fillRect(-14,-10,22,18);
  ctx.fillStyle=color; ctx.fillRect(18,-10,6,20);
  if(lights){ ctx.fillStyle='#fef08a'; ctx.fillRect(22,-9,4); ctx.fillRect(22,5,4,4); ctx.fillStyle='rgba(254,240,138,.3)'; ctx.fillRect(26,-10,14,6); ctx.fillRect(26,4,14,6); }
  ctx.fillStyle='#ef4444'; ctx.fillRect(-24,-8,3,3); ctx.fillRect(-24,5,3,3);
  ctx.restore();
}

function loop(){
  // input
  let mx=0,my=0; if(keys['w']) my=1; if(keys['s']) my=-1; if(keys['a']) mx=-1; if(keys['d']) mx=1;
  if(keys['e'] && !inCar){
    const near=cars.find(c=>Math.hypot(c.x-x,c.y-y)<70);
    if(near){ playerCar=near; inCar=true; cars=cars.filter(c=>c!==near); wanted=Math.min(5,wanted+1); cash+=350; }
  }
  if(keys['f'] && inCar){ /* honk */ }

  if(inCar){
    if(my!==0) speed+=my*0.18; else speed*=0.98;
    speed=Math.max(-4,Math.min(7,speed));
    if(Math.abs(speed)>0.5 && mx!==0) angle+=mx*speed*0.5;
    if(keys[' ']){ speed*=0.92; if(Math.abs(speed)>2){ particles.push({x,y,a:angle+90+Math.random()*20, life:20}); particles.push({x,y,a:angle-90-Math.random()*20, life:20}); } }
    x+=Math.cos(angle*Math.PI/180)*speed*3;
    y+=Math.sin(angle*Math.PI/180)*speed*3;
  }else{
    x+=mx*3; y+=my*3; angle+=mx*2; speed=Math.hypot(mx,my)*4;
  }

  // world update
  cars.forEach(c=>{ c.x+=Math.cos(c.a*Math.PI/180)*c.v*2; c.y+=Math.sin(c.a*Math.PI/180)*c.v*2; if(Math.random()<0.01) c.a+=(Math.random()-0.5)*40; });

  // cops logic
  if(wanted>0.5 && cops.length<4 && Math.random()<0.02){
    cops.push({x:x+(Math.random()-0.5)*600, y:y+(Math.random()-0.5)*600, a:0});
  }
  cops.forEach(cp=>{
    const dx=x-cp.x, dy=y-cp.y, d=Math.hypot(dx,dy);
    cp.a=Math.atan2(dy,dx)*180/Math.PI;
    cp.x+=Math.cos(cp.a*Math.PI/180)*2.2; cp.y+=Math.sin(cp.a*Math.PI/180)*2.2;
    if(d<50){ health-=0.6; if(Math.random()<0.05) wanted+=0.1; }
  });

  // render
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.save(); ctx.translate(canvas.width/2 - x, canvas.height/2 - y);

  // ground
  ctx.fillStyle='#1e293b'; ctx.fillRect(-2000,-2000,4000,4000);
  roads.forEach(r=>{ ctx.fillStyle='#334155'; ctx.fillRect(r.x,r.y,r.w,r.h); ctx.fillStyle='#eab308'; ctx.fillRect(r.x+r.w/2-2,r.y,4,r.h); });
  // buildings with shadow
  for(let i=0;i<40;i++){
    const bx=(i%8)*250-1000, by=Math.floor(i/8)*280
