<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GTA - Homa Bay Edition</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#0f172a;color:white;overflow:hidden}
#hud{position:absolute;top:0;left:0;right:0;padding:10px 16px;display:flex;justify-content:space-between;z-index:10;background:linear-gradient(to bottom,rgba(0,0,0,.7),transparent)}
#game{width:100vw;height:100vh;background:#1e293b;position:relative;overflow:hidden;cursor:crosshair}
#map{position:absolute;width:2000px;height:2000px;background:repeating-linear-gradient(0deg,#1e293b 0 98px,#334155 98px 100px),repeating-linear-gradient(90deg,#1e293b 0 98px,#334155 98px 100px);top:-800px;left:-800px}
.road{position:absolute;background:#475569}
.building{position:absolute;background:#0f172a;border:2px solid #334155}
#player{position:absolute;width:28px;height:28px;left:50%;top:50%;transform:translate(-50%,-50%);z-index:5;transition:transform .1s}
#player .body{width:28px;height:28px;background:#3b82f6;border-radius:50% 50% 4px 4px;position:relative;display:flex;align-items:center;justify-content:center;font-size:18px}
#player.in-car .body{background:#f59e0b;width:50px;height:28px;border-radius:6px}
.car{position:absolute;width:52px;height:26px;background:#f59e0b;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:14px;box-shadow:0 2px 8px rgba(0,0,0,.5);cursor:pointer}
.cop{position:absolute;width:28px;height:28px;background:#ef4444;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px}
.star{color:#f59e0b}
.controls{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.7);padding:8px 14px;border-radius:20px;font-size:11px;display:flex;gap:12px;z-index:10}
.controls b{color:#f59e0b}
#minimap{position:absolute;bottom:12px;right:12px;width:120px;height:120px;background:rgba(0,0,0,.6);border:2px solid #334155;border-radius:10px;z-index:10;overflow:hidden}
#miniPlayer{position:absolute;width:6px;height:6px;background:#3b82f6;border-radius:50%;left:50%;top:50%}
</style>
</head>
<body>
<div id="hud">
  <div>⭐ <span id="stars">0</span> WANTED | 💰 KSh <span id="cash">500</span> | 🚗 <span id="speed">0</span> km/h</div>
  <div>📍 Homa Bay Town - Lake Primary Zone | Health <span id="health">100</span>%</div>
</div>
<div id="game">
  <div id="map"></div>
  <div id="player"><div class="body">🧍</div></div>
  <div id="minimap"><div id="miniPlayer"></div></div>
  <div class="controls"><span><b>WASD</b> Move</span><span><b>E</b> Enter Car</span><span><b>SPACE</b> Brake / Punch</span><span><b>G</b> Steal Car</span></div>
</div>

<script>
const game=document.getElementById('game'), map=document.getElementById('map'), playerEl=document.getElementById('player');
let x=0,y=0, vx=0, vy=0, inCar=false, speed=0, angle=0, wanted=0, cash=500, health=100;
let keys={};

// Build city
for(let i=0;i<20;i++){
  const rd=document.createElement('div'); rd.className='road';
  rd.style.left=Math.random()*1800+'px'; rd.style.top=Math.random()*1800+'px';
  rd.style.width=(Math.random()>0.5?600:100)+'px'; rd.style.height=(Math.random()>0.5?600:100)+'px';
  map.appendChild(rd);
  const bd=document.createElement('div'); bd.className='building';
  bd.style.left=(parseInt(rd.style.left)+120)+'px'; bd.style.top=(parseInt(rd.style.top)+120)+'px';
  bd.style.width=80+'px'; bd.style.height=80+'px';
  map.appendChild(bd);
}

// Cars
let cars=[];
for(let i=0;i<8;i++){
  const c=document.createElement('div'); c.className='car';
  c.innerHTML='🚕'; c.style.left=Math.random()*1600+'px'; c.style.top=Math.random()*1600+'px';
  c.dataset.vx=(Math.random()-0.5)*2; c.dataset.vy=(Math.random()-0.5)*2;
  map.appendChild(c); cars.push(c);
}

// Cops
let cops=[];
function spawnCop(){
  if(cops.length>3) return;
  const c=document.createElement('div'); c.className='cop'; c.innerHTML='🚓';
  c.style.left=(x+800+Math.random()*400-200)+'px'; c.style.top=(y+800+Math.random()*400-200)+'px';
  map.appendChild(c); cops.push(c);
}

window.addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true);
window.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);

function loop(){
  let mx=0,my=0;
  if(keys['w']) my=-1; if(keys['s']) my=1; if(keys['a']) mx=-1; if(keys['d']) mx=1;
  if(keys['e']){ // enter nearest car
    const near=cars.find(c=>{
      const cx=parseFloat(c.style.left), cy=parseFloat(c.style.top);
      return Math.hypot(cx-(x+800), cy-(y+800))<80;
    });
    if(near && !inCar){ inCar=true; playerEl.classList.add('in-car'); playerEl.querySelector('.body').textContent='🚕'; near.remove(); wanted=Math.min(5,wanted+1); cash+=200; }
  }
  if(keys[' '] && inCar){ speed*=0.9; } // brake
  if(inCar){
    if(mx!==0) angle+=mx*3;
    speed+=my*0.4; speed*=0.97;
    x+=Math.cos(angle*Math.PI/180)*speed*2;
    y+=Math.sin(angle*Math.PI/180)*speed*2;
    playerEl.style.transform=`translate(-50%,-50%) rotate(${angle}deg)`;
  }else{
    x+=mx*4; y+=my*4;
    speed=Math.hypot(mx,my)*15;
  }
  map.style.transform=`translate(${-x}px,${-y}px)`;
  
  // move cars
  cars.forEach(c=>{
    c.style.left=parseFloat(c.style.left)+parseFloat(c.dataset.vx)+'px';
    c.style.top=parseFloat(c.style.top)+parseFloat(c.dataset.vy)+'px';
  });
  // cops chase
  cops.forEach(c=>{
    const cx=parseFloat(c.style.left), cy=parseFloat(c.style.top);
    const dx=(x+800)-cx, dy=(y+800)-cy;
    c.style.left=cx+dx*0.01+'px'; c.style.top=cy+dy*0.01+'px';
    if(Math.hypot(dx,dy)<40){ health-=0.3; wanted=Math.min(5,wanted+0.01); }
  });
  if(wanted>1 && Math.random()<0.02) spawnCop();
  if(wanted>0 && Math.random()<0.005) wanted-=0.1;

  document.getElementById('speed').textContent=Math.round(Math.abs(speed*5));
  document.getElementById('stars').textContent='★'.repeat(Math.floor(wanted));
  document.getElementById('cash').textContent=cash;
  document.getElementById('health').textContent=Math.max(0,Math.floor(health));
  if(health<=0){ alert('WASTED! You were caught in Homa Bay. Restarting...'); location.reload(); }
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>ddddddddddd
