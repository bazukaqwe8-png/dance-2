<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GTA Homa Bay - Real Map Edition</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#000;overflow:hidden;font-family:system-ui;color:white}
canvas{display:block}#hud{position:absolute;top:0;left:0;right:0;height:70px;background:linear-gradient(to bottom,rgba(0,0,0,.9),transparent);display:flex;justify-content:space-between;padding:12px 18px;z-index:20}
.badge{background:rgba(255,255,255,.15);backdrop-filter:blur(10px);padding:6px 12px;border-radius:20px;font-size:12px;border:1px solid rgba(255,255,255,.1)}
#cross{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:20px;opacity:.6;z-index:10;pointer-events:none}
#carInterior{position:absolute;bottom:0;left:0;right:0;height:42%;background:linear-gradient(to top,#0a0a0a 60%,transparent);z-index:5;pointer-events:none;display:none}
#wheel{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);font-size:80px;z-index:6;transition:.1s;display:none}
#realMap{position:absolute;bottom:12px;right:12px;width:170px;height:170px;border-radius:12px;overflow:hidden;border:2px solid #334155;z-index:20;background:#1e293b}
#realMap iframe{width:100%;height:100%;border:0;filter:grayscale(0.3) contrast(1.2)}
</style>
</head>
<body>
<div id="hud">
<div style="display:flex;gap:10px"><div class="badge">⭐ <span id="stars">★☆☆☆☆</span></div><div class="badge">💰 <span id="cash">2500</span></div><div class="badge">🔫 <span id="ammo">30</span></div><div class="badge">❤️ <span id="hp">100</span></div></div>
<div class="badge">📍 REAL HOMA BAY TOWNSHIP -0.5223, 34.4581</div>
</div>
<div id="cross">+</div>
<div id="carInterior"></div><div id="wheel">🛞</div>
<canvas id="c"></canvas>
<div id="realMap"><iframe src="https://www.openstreetmap.org/export/embed.html?bbox=34.44%2C-0.54%2C34.48%2C-0.50&layer=mapnik&marker=-0.522%2C34.46"></iframe></div>
<div style="position:absolute;bottom:12px;left:12px;background:rgba(0,0,0,.75);padding:10px 14px;border-radius:12px;font-size:11px;z-index:20;line-height:1.7"> <b style="color:#f59e0b">WASD</b> Drive/Walk &nbsp; <b>Mouse</b> Look/Shoot &nbsp; <b>E</b> Enter Car &nbsp; <b>SPACE</b> Drift &nbsp; <b>Click</b> Shoot<br><b>TAB</b> Switch First/Third Person &nbsp; Real location: Lake Primary is near Homa Bay Town!</div>

<script>
const canvas=document.getElementById('c'), ctx=canvas.getContext('2d');
function resize(){canvas.width=innerWidth; canvas.height=innerHeight} resize(); addEventListener('resize',resize);
let x=0,y=0,angle=0,speed=0,inCar=true,wanted=1,health=100,ammo=30,firstPerson=true,keys={},cars=[],bullets=[],cops=[];
let mouseX=0;
canvas.addEventListener('mousemove',e=>{ if(inCar && firstPerson) angle+= (e.clientX-innerWidth/2)*0.003; mouseX=e.clientX; });
canvas.addEventListener('click',()=>{ if(ammo>0){ bullets.push({x,y,a:angle,life:40}); ammo--; if(!inCar) wanted+=0.3; }});

onkeydown=e=>{ keys[e.key.toLowerCase()]=true; if(e.key==='Tab'){ e.preventDefault(); firstPerson=!firstPerson; } if(e.key.toLowerCase()==='e'){ inCar=!inCar; document.getElementById('carInterior').style.display=inCar&&firstPerson?'block':'none'; document.getElementById('wheel').style.display=inCar&&firstPerson?'block':'none'; }};
onkeyup=e=>keys[e.key.toLowerCase()]=false;

for(let i=0;i<10;i++) cars.push({x:(Math.random()-0.5)*1500,y:(Math.random()-0.5)*1500,a:Math.random()*360});

function loop(){
 let mx=0,my=0; if(keys['w']) my=1; if(keys['s']) my=-1; if(keys['a']) mx=-1; if(keys['d']) mx=1;
 if(inCar){ if(my) speed+=my*0.12; speed*=0.985; if(Math.abs(speed)>0.5) angle+=mx*speed*0.8; if(keys[' ']) speed*=0.92; x+=Math.cos(angle*Math.PI/180)*speed*4; y+=Math.sin(angle*Math.PI/180)*speed*4; document.getElementById('wheel').style.transform=`translateX(-50%) rotate(${angle*2}deg)`; }
 else{ x+=mx*3; y+=my*3; }

 // bullets
 bullets=bullets.filter(b=>b.life>0); bullets.forEach(b=>{ b.life--; b.x+=Math.cos(b.a*Math.PI/180)*12; b.y+=Math.sin(b.a*Math.PI/180)*12; });

 // draw realistic ground
 ctx.fillStyle='#162032'; ctx.fillRect(0,0,canvas.width,canvas.height);
 ctx.save(); ctx.translate(canvas.width/2 - x, canvas.height/2 - y);
 // roads grid like Homa Bay town
 ctx.fillStyle='#2a3447'; for(let i=-1500;i<1500;i+=260){ ctx.fillRect(i,-1500,30,3000); ctx.fillRect(-1500,i,3000,30); }
 // lake Victoria blue edge
 ctx.fillStyle='#1e3a8a'; ctx.fillRect(-1500,800,3000,900); ctx.fillStyle='#3b82f6'; ctx.font='bold 40px sans-serif'; ctx.fillText('LAKE VICTORIA - VICTORIA',-400,950);
 // buildings
 for(let i=0;i<30;i++){ let bx=(i%6)*260-800, by=Math.floor(i/6)*260-800; ctx.fillStyle='#0f172a'; ctx.fillRect(bx,by,120,120); ctx.strokeStyle='#334155'; ctx.strokeRect(bx,by,120,120); ctx.fillStyle='#f59e0b'; if(i==7){ ctx.fillStyle='#ef4444'; ctx.fillRect(bx,by,120,120); ctx.fillStyle='white'; ctx.fillText('LAKE PRIMARY',bx+5,by+60); } }
 cars.forEach(c=>{ ctx.fillStyle='#f59e0b'; ctx.fillRect(c.x-20,c.y-10,40,20); });
 cops.forEach(c=>{ ctx.fillStyle='#ef4444'; ctx.beginPath(); ctx.arc(c.x,c.y,12,0,Math.PI*2); ctx.fill(); });
 bullets.forEach(b=>{ ctx.fillStyle='#fef08a'; ctx.beginPath(); ctx.arc(b.x,b.y,4,0,Math.PI*2); ctx.fill(); });
 ctx.fillStyle=inCar?'#f59e0b':'#3b82f6'; ctx.beginPath(); ctx.arc(x,y,10,0,Math.PI*2); ctx.fill();
 ctx.restore();

 // first person overlay
 if(inCar && firstPerson){
   ctx.fillStyle='rgba(0,0,0,.3)'; ctx.fillRect(0,0,canvas.width,canvas.height*0.4);
   // dashboard
   ctx.fillStyle='#111'; ctx.fillRect(0,canvas.height*0.65,canvas.width,canvas.height*0.35);
   ctx.fillStyle='#222'; ctx.fillRect(canvas.width*0.2,canvas.height*0.7,canvas.width*0.6,80);
   ctx.fillStyle='#f59e0b'; ctx.font='14px monospace'; ctx.fillText(`SPEED ${Math.abs(speed*20).toFixed(0)} KM/H`,canvas.width*0.25,canvas.height*0.8);
 }

 document.getElementById('stars').textContent='★'.repeat(Math.floor(wanted))+'☆'.repeat(5-Math.floor(wanted));
 document.getElementById('cash').textContent=2500;
 document.getElementById('ammo').textContent=ammo;
 document.getElementById('hp').textContent=Math.floor(health);
 requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
